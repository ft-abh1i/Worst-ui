<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Page</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: #172033;
      background:
        radial-gradient(circle at 12% 15%, rgba(99, 102, 241, 0.22), transparent 28rem),
        radial-gradient(circle at 88% 85%, rgba(14, 165, 233, 0.16), transparent 26rem),
        #eef2ff;
      font-family: Arial, sans-serif;
    }

    .signup-card {
      width: min(100%, 430px);
      padding: 34px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(31, 41, 80, 0.15);
    }

    h1 {
      margin-bottom: 8px;
      font-size: 30px;
      line-height: 1.2;
    }

    .subtitle {
      margin-bottom: 26px;
      color: #667085;
      font-size: 16px;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      color: #172033;
      background: white;
      border: 1px solid #d9dfeb;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.16);
    }

    input[aria-invalid="true"] {
      border-color: #c62828;
    }

    #fullName[readonly][aria-busy="true"],
    #email[readonly][aria-busy="true"] {
      color: #667085;
      background: #f7f7ff;
      cursor: wait;
    }

    .name-feedback {
      position: relative;
      min-height: 15px;
    }

    .name-feedback .error {
      position: absolute;
      inset: 0;
    }

    .processing-status {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      gap: 7px;
      color: #4f46e5;
      font-size: 12px;
      font-weight: bold;
    }

    .processing-status.show {
      display: flex;
    }

    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid #c7d2fe;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .email-confirm {
      min-height: 42px;
      padding: 9px 14px;
      color: white;
      background: #4f46e5;
      border: 1px solid #4f46e5;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: 0.15s;
    }

    .email-confirm:hover:not(:disabled) {
      background: #4338ca;
      transform: translateY(-1px);
    }

    .email-confirm:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .email-confirm.confirmed {
      color: #087f5b;
      background: #eafaf4;
      border-color: #b7ead8;
      opacity: 1;
    }

    .email-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(4px);
    }

    .email-modal.show {
      display: grid;
    }

    .email-modal-card {
      width: min(100%, 390px);
      padding: 26px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
      text-align: center;
    }

    .email-modal-card h2 {
      margin-bottom: 10px;
      font-size: 21px;
      line-height: 1.3;
    }

    .email-modal-card p {
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    .email-to-confirm {
      display: block;
      margin-top: 12px;
      padding: 11px;
      overflow-wrap: anywhere;
      color: #172033;
      background: #f3f4ff;
      border: 1px solid #d9dfeb;
      border-radius: 10px;
      font-weight: bold;
    }

    .email-modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .email-modal-button {
      min-height: 44px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .email-modal-button.edit {
      color: #475467;
      background: white;
      border: 1px solid #d9dfeb;
    }

    .email-modal-button.yes {
      color: white;
      background: #4f46e5;
      border: 1px solid #4f46e5;
    }

    .phone-picker {
      display: grid;
      gap: 10px;
      padding: 14px;
      background: #f8f9ff;
      border: 1px solid #dfe3f0;
      border-radius: 14px;
      outline: none;
    }

    .phone-picker[aria-invalid="true"] {
      border-color: #c62828;
    }

    .phone-digits {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 5px;
    }

    .phone-digit {
      min-width: 0;
      height: 42px;
      display: grid;
      place-items: center;
      color: #98a2b3;
      background: white;
      border: 1px solid #d9dfeb;
      border-radius: 8px;
      font-size: 19px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      transition: 0.15s;
    }

    .phone-digit.active {
      color: #4f46e5;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
      transform: translateY(-2px);
    }

    .phone-digit.locked {
      color: #172033;
      background: #eef2ff;
      border-color: #c7d2fe;
    }

    .phone-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .phone-button {
      min-height: 42px;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: 0.15s;
    }

    .phone-button.restart {
      color: #475467;
      background: white;
      border: 1px solid #d9dfeb;
    }

    .phone-button.set {
      color: white;
      background: #4f46e5;
      border: 1px solid #4f46e5;
    }

    .phone-button:hover {
      transform: translateY(-1px);
    }

    .phone-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .phone-status {
      min-height: 16px;
      color: #667085;
      font-size: 12px;
      line-height: 1.35;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 65px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      padding: 6px;
      color: #4f46e5;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    .error {
      min-height: 15px;
      color: #c62828;
      font-size: 12px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: #667085;
      font-size: 14px;
      font-weight: normal;
      line-height: 1.4;
      cursor: pointer;
    }

    .terms input {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: #4f46e5;
    }

    .terms-error {
      margin-top: -12px;
    }

    .submit-btn {
      height: 50px;
      color: white;
      background: #4f46e5;
      border: none;
      border-radius: 13px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
      transition: 0.2s;
    }

    .submit-btn:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }

    .success-message {
      display: none;
      padding: 13px 16px;
      color: #087f5b;
      background: #eafaf4;
      border: 1px solid #b7ead8;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.4;
    }

    .success-message.show {
      display: block;
    }

    .login-text {
      margin-top: 23px;
      color: #667085;
      text-align: center;
      font-size: 14px;
    }

    .login-text a {
      color: #4f46e5;
      font-weight: bold;
      text-decoration: none;
    }

    @media (max-width: 500px) {
      .signup-card {
        padding: 24px;
        border-radius: 20px;
      }

      h1 {
        font-size: 26px;
      }

      .phone-picker {
        padding: 11px;
      }

      .phone-digits {
        gap: 3px;
      }

      .phone-digit {
        height: 38px;
        border-radius: 6px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="signup-card">
    <h1>Create your account</h1>
    <p class="subtitle">Enter your details to get started.</p>

    <form id="signupForm" novalidate>
      <div class="field">
        <label for="fullName">Full name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          data-lpignore="true"
          data-1p-ignore="true"
          aria-busy="false"
          readonly
        >
        <div class="name-feedback">
          <small
            class="processing-status"
            id="nameProcessing"
            role="status"
            aria-live="polite"
          >
            <span class="spinner" aria-hidden="true"></span>
            Processing...
          </small>
          <small class="error" id="nameError"></small>
        </div>
      </div>

      <div class="field">
        <label id="phoneLabel">Phone number</label>
        <div
          class="phone-picker"
          id="phonePicker"
          role="group"
          aria-labelledby="phoneLabel"
          aria-invalid="false"
          tabindex="-1"
        >
          <div class="phone-digits" id="phoneDigits" aria-label="Phone number digits">
            <span class="phone-digit active" data-index="0">0</span>
            <span class="phone-digit" data-index="1"></span>
            <span class="phone-digit" data-index="2"></span>
            <span class="phone-digit" data-index="3"></span>
            <span class="phone-digit" data-index="4"></span>
            <span class="phone-digit" data-index="5"></span>
            <span class="phone-digit" data-index="6"></span>
            <span class="phone-digit" data-index="7"></span>
            <span class="phone-digit" data-index="8"></span>
            <span class="phone-digit" data-index="9"></span>
          </div>

          <div class="phone-actions">
            <button type="button" class="phone-button restart" id="restartPhone">
              Restart
            </button>
            <button type="button" class="phone-button set" id="setPhoneDigit">
              Set digit
            </button>
          </div>

          <small class="phone-status" id="phoneStatus" role="status" aria-live="polite">
            Press Set digit to lock the moving number.
          </small>
        </div>
        <input type="hidden" id="phoneNumber" name="phoneNumber">
        <small class="error" id="phoneError"></small>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          data-lpignore="true"
          data-1p-ignore="true"
          aria-busy="false"
          readonly
        >
        <div class="name-feedback">
          <small
            class="processing-status"
            id="emailProcessing"
            role="status"
            aria-live="polite"
          >
            <span class="spinner" aria-hidden="true"></span>
            Processing...
          </small>
          <small class="error" id="emailError"></small>
        </div>
        <button type="button" class="email-confirm" id="confirmEmail" disabled>
          Confirm email
        </button>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-box">
          <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
          >
          <button type="button" class="show-password" data-target="password">
            Show
          </button>
        </div>
        <small class="error" id="passwordError"></small>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <div class="password-box">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Enter your password again"
            autocomplete="new-password"
          >
          <button type="button" class="show-password" data-target="confirmPassword">
            Show
          </button>
        </div>
        <small class="error" id="confirmError"></small>
      </div>

      <label class="terms" for="terms">
        <input type="checkbox" id="terms">
        <span>I agree to the Terms and Privacy Policy.</span>
      </label>
      <small class="error terms-error" id="termsError"></small>

      <button type="submit" class="submit-btn">Create account</button>
      <div class="success-message" id="successMessage" role="status"></div>
    </form>

    <p class="login-text">
      Already have an account? <a href="#">Log in</a>
    </p>
  </main>

  <div
    class="email-modal"
    id="emailConfirmModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="emailConfirmTitle"
    aria-hidden="true"
  >
    <div class="email-modal-card">
      <h2 id="emailConfirmTitle">Check if this email is correct</h2>
      <p>
        Please check the email once more.
        <span class="email-to-confirm" id="emailToConfirm"></span>
      </p>
      <div class="email-modal-actions">
        <button type="button" class="email-modal-button edit" id="editEmail">
          Edit
        </button>
        <button type="button" class="email-modal-button yes" id="acceptEmail">
          Yes
        </button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("signupForm");
    const fullName = document.getElementById("fullName");
    const email = document.getElementById("email");
    const confirmEmail = document.getElementById("confirmEmail");
    const emailConfirmModal = document.getElementById("emailConfirmModal");
    const emailToConfirm = document.getElementById("emailToConfirm");
    const editEmail = document.getElementById("editEmail");
    const acceptEmail = document.getElementById("acceptEmail");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const terms = document.getElementById("terms");
    const successMessage = document.getElementById("successMessage");
    const nameProcessing = document.getElementById("nameProcessing");
    const emailProcessing = document.getElementById("emailProcessing");
    const phonePicker = document.getElementById("phonePicker");
    const phoneNumber = document.getElementById("phoneNumber");
    const phoneStatus = document.getElementById("phoneStatus");
    const phoneError = document.getElementById("phoneError");
    const setPhoneDigit = document.getElementById("setPhoneDigit");
    const restartPhone = document.getElementById("restartPhone");
    const phoneDigitBoxes = Array.from(document.querySelectorAll(".phone-digit"));
    let isNameProcessing = false;
    let nameProcessingTimer;
    let isEmailProcessing = false;
    let emailProcessingTimer;
    let isEmailConfirmed = false;
    let isEmailReviewOpen = false;
    let acceptedFullName = "";
    let acceptedEmail = "";
    let selectedPhoneDigits = Array(10).fill(null);

    fullName.value = "";
    email.value = "";
    let activePhoneDigit = 0;
    let movingPhoneDigit = 0;
    let phoneCounterTimer;

    function showError(input, errorId, message) {
      document.getElementById(errorId).textContent = message;
      input.setAttribute("aria-invalid", message ? "true" : "false");
    }

    function validEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function countNameLetters(value) {
      return (value.match(/\p{L}/gu) || []).length;
    }

    function startPhoneCounter() {
      clearInterval(phoneCounterTimer);

      if (activePhoneDigit >= phoneDigitBoxes.length) {
        return;
      }

      phoneDigitBoxes.forEach((box, index) => {
        box.classList.toggle("active", index === activePhoneDigit);
      });

      movingPhoneDigit = 0;
      phoneDigitBoxes[activePhoneDigit].textContent = movingPhoneDigit;

      phoneCounterTimer = setInterval(() => {
        movingPhoneDigit = (movingPhoneDigit + 1) % 10;
        phoneDigitBoxes[activePhoneDigit].textContent = movingPhoneDigit;
      }, 140);
    }

    function resetPhoneNumber(showMessage = true) {
      clearInterval(phoneCounterTimer);
      selectedPhoneDigits = Array(10).fill(null);
      activePhoneDigit = 0;
      movingPhoneDigit = 0;
      phoneNumber.value = "";
      setPhoneDigit.disabled = false;
      phonePicker.setAttribute("aria-invalid", "false");
      phoneError.textContent = "";

      phoneDigitBoxes.forEach((box) => {
        box.textContent = "";
        box.classList.remove("active", "locked");
      });

      if (showMessage) {
        phoneStatus.textContent = "Restarted. Set the first moving digit.";
      }

      startPhoneCounter();
    }

    setPhoneDigit.addEventListener("click", () => {
      if (activePhoneDigit >= phoneDigitBoxes.length) {
        return;
      }

      clearInterval(phoneCounterTimer);
      selectedPhoneDigits[activePhoneDigit] = String(movingPhoneDigit);
      phoneDigitBoxes[activePhoneDigit].textContent = movingPhoneDigit;
      phoneDigitBoxes[activePhoneDigit].classList.remove("active");
      phoneDigitBoxes[activePhoneDigit].classList.add("locked");
      activePhoneDigit += 1;
      phonePicker.setAttribute("aria-invalid", "false");
      phoneError.textContent = "";

      if (activePhoneDigit === phoneDigitBoxes.length) {
        phoneNumber.value = selectedPhoneDigits.join("");
        setPhoneDigit.disabled = true;
        phoneStatus.textContent = "All 10 digits are set.";
        return;
      }

      phoneStatus.textContent =
        "Digit " + activePhoneDigit + " saved. Set the next moving digit.";
      startPhoneCounter();
    });

    restartPhone.addEventListener("click", () => {
      resetPhoneNumber(true);
    });

    function isSingleManualCharacter(event, previousValue, currentValue) {
      const inputType = event.inputType || "";
      const insertedLength = Array.from(event.data || "").length;
      const lengthChange =
        Array.from(currentValue).length - Array.from(previousValue).length;

      return (
        (inputType === "insertText" || inputType === "insertCompositionText") &&
        insertedLength === 1 &&
        lengthChange === 1
      );
    }

    function unlockFullName() {
      if (!isNameProcessing) {
        fullName.readOnly = false;
      }
    }

    fullName.addEventListener("pointerdown", unlockFullName);
    fullName.addEventListener("focus", unlockFullName);
    fullName.addEventListener("blur", () => {
      if (!isNameProcessing) {
        fullName.readOnly = true;
      }
    });

    fullName.addEventListener("input", (event) => {
      const enteredValue = fullName.value;

      if (!isSingleManualCharacter(event, acceptedFullName, enteredValue)) {
        fullName.value = acceptedFullName;
        return;
      }

      acceptedFullName = enteredValue;

      if (isNameProcessing) return;

      isNameProcessing = true;
      fullName.readOnly = true;
      fullName.setAttribute("aria-busy", "true");
      document.getElementById("nameError").textContent = "";
      nameProcessing.classList.add("show");

      clearTimeout(nameProcessingTimer);
      nameProcessingTimer = setTimeout(() => {
        isNameProcessing = false;
        fullName.readOnly = false;
        fullName.setAttribute("aria-busy", "false");
        nameProcessing.classList.remove("show");
        fullName.focus();
        fullName.setSelectionRange(fullName.value.length, fullName.value.length);
      }, 1000);
    });

    ["copy", "cut", "paste", "drop"].forEach((eventName) => {
      fullName.addEventListener(eventName, (event) => {
        event.preventDefault();
      });
    });

    function clearFullName() {
      clearTimeout(nameProcessingTimer);
      isNameProcessing = false;
      acceptedFullName = "";
      fullName.value = "";
      fullName.readOnly = false;
      fullName.setAttribute("aria-busy", "false");
      fullName.setAttribute("aria-invalid", "false");
      document.getElementById("nameError").textContent = "";
      nameProcessing.classList.remove("show");
    }

    fullName.addEventListener("keydown", (event) => {
      if ((event.key === "Backspace" || event.key === "Delete") && fullName.value) {
        event.preventDefault();
        clearFullName();
      }
    });

    fullName.addEventListener("beforeinput", (event) => {
      const isBlockedInsert =
        event.inputType === "insertFromPaste" ||
        event.inputType === "insertFromDrop" ||
        event.inputType === "insertReplacementText" ||
        (event.inputType?.startsWith("insert") &&
          Array.from(event.data || "").length > 1);

      if (isBlockedInsert) {
        event.preventDefault();
        return;
      }

      if (event.inputType?.startsWith("delete") && fullName.value) {
        event.preventDefault();
        clearFullName();
      }
    });

    function unlockEmail() {
      if (!isEmailProcessing && !isEmailConfirmed && !isEmailReviewOpen) {
        email.readOnly = false;
      }
    }

    email.addEventListener("pointerdown", unlockEmail);
    email.addEventListener("focus", unlockEmail);
    email.addEventListener("blur", () => {
      if (!isEmailProcessing) {
        email.readOnly = true;
      }
    });

    email.addEventListener("input", (event) => {
      const enteredValue = email.value;

      if (!isSingleManualCharacter(event, acceptedEmail, enteredValue)) {
        email.value = acceptedEmail;
        return;
      }

      acceptedEmail = enteredValue;
      isEmailConfirmed = false;
      isEmailReviewOpen = false;
      confirmEmail.disabled = true;
      confirmEmail.textContent = "Confirm email";
      confirmEmail.classList.remove("confirmed");
      emailConfirmModal.classList.remove("show");
      emailConfirmModal.setAttribute("aria-hidden", "true");

      if (isEmailProcessing) return;

      isEmailProcessing = true;
      email.readOnly = true;
      email.setAttribute("aria-busy", "true");
      document.getElementById("emailError").textContent = "";
      emailProcessing.classList.add("show");

      clearTimeout(emailProcessingTimer);
      emailProcessingTimer = setTimeout(() => {
        isEmailProcessing = false;
        email.readOnly = false;
        email.setAttribute("aria-busy", "false");
        emailProcessing.classList.remove("show");
        confirmEmail.disabled = !validEmail(email.value.trim());
        email.focus();
      }, 1000);
    });

    ["copy", "cut", "paste", "drop"].forEach((eventName) => {
      email.addEventListener(eventName, (event) => {
        event.preventDefault();
      });
    });

    function clearEmail() {
      clearTimeout(emailProcessingTimer);
      isEmailProcessing = false;
      acceptedEmail = "";
      isEmailConfirmed = false;
      isEmailReviewOpen = false;
      email.value = "";
      email.readOnly = false;
      confirmEmail.disabled = true;
      confirmEmail.textContent = "Confirm email";
      confirmEmail.classList.remove("confirmed");
      emailConfirmModal.classList.remove("show");
      emailConfirmModal.setAttribute("aria-hidden", "true");
      email.setAttribute("aria-busy", "false");
      email.setAttribute("aria-invalid", "false");
      document.getElementById("emailError").textContent = "";
      emailProcessing.classList.remove("show");
    }

    email.addEventListener("keydown", (event) => {
      if ((event.key === "Backspace" || event.key === "Delete") && email.value) {
        event.preventDefault();
        clearEmail();
      }
    });

    email.addEventListener("beforeinput", (event) => {
      const isBlockedInsert =
        event.inputType === "insertFromPaste" ||
        event.inputType === "insertFromDrop" ||
        event.inputType === "insertReplacementText" ||
        (event.inputType?.startsWith("insert") &&
          Array.from(event.data || "").length > 1);

      if (isBlockedInsert) {
        event.preventDefault();
        return;
      }

      if (event.inputType?.startsWith("delete") && email.value) {
        event.preventDefault();
        clearEmail();
      }
    });

    confirmEmail.addEventListener("click", () => {
      if (!validEmail(email.value.trim())) {
        showError(email, "emailError", "Please enter a valid email address.");
        return;
      }

      clearTimeout(emailProcessingTimer);
      isEmailProcessing = false;
      isEmailConfirmed = false;
      isEmailReviewOpen = true;
      email.readOnly = true;
      email.setAttribute("aria-busy", "false");
      email.setAttribute("aria-invalid", "false");
      document.getElementById("emailError").textContent = "";
      emailProcessing.classList.remove("show");
      confirmEmail.disabled = true;
      emailToConfirm.textContent = email.value.trim();
      emailConfirmModal.classList.add("show");
      emailConfirmModal.setAttribute("aria-hidden", "false");
      acceptEmail.focus();
    });

    acceptEmail.addEventListener("click", () => {
      isEmailReviewOpen = false;
      isEmailConfirmed = true;
      emailConfirmModal.classList.remove("show");
      emailConfirmModal.setAttribute("aria-hidden", "true");
      confirmEmail.disabled = true;
      confirmEmail.textContent = "Email confirmed";
      confirmEmail.classList.add("confirmed");
      password.focus();
    });

    editEmail.addEventListener("click", () => {
      isEmailReviewOpen = false;
      isEmailConfirmed = false;
      emailConfirmModal.classList.remove("show");
      emailConfirmModal.setAttribute("aria-hidden", "true");
      confirmEmail.disabled = !validEmail(email.value.trim());
      confirmEmail.textContent = "Confirm email";
      confirmEmail.classList.remove("confirmed");
      email.readOnly = false;
      email.focus();
    });

    document.querySelectorAll(".show-password").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const hidden = input.type === "password";

        input.type = hidden ? "text" : "password";
        button.textContent = hidden ? "Hide" : "Show";
      });
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      let isValid = true;

      showError(fullName, "nameError", "");
      showError(email, "emailError", "");
      showError(password, "passwordError", "");
      showError(confirmPassword, "confirmError", "");
      phonePicker.setAttribute("aria-invalid", "false");
      phoneError.textContent = "";
      document.getElementById("termsError").textContent = "";
      successMessage.classList.remove("show");

      if (countNameLetters(fullName.value) < 6) {
        showError(fullName, "nameError", "Name must contain at least 6 letters.");
        isValid = false;
      }

      if (selectedPhoneDigits.some((digit) => digit === null)) {
        phonePicker.setAttribute("aria-invalid", "true");
        phoneError.textContent = "Please set all 10 phone number digits.";
        isValid = false;
      }

      if (!validEmail(email.value.trim())) {
        showError(email, "emailError", "Please enter a valid email address.");
        isValid = false;
      } else if (!isEmailConfirmed) {
        showError(email, "emailError", "Please confirm your email address.");
        isValid = false;
      }

      if (password.value.length < 8) {
        showError(password, "passwordError", "Password must have at least 8 characters.");
        isValid = false;
      }

      if (!confirmPassword.value || confirmPassword.value !== password.value) {
        showError(confirmPassword, "confirmError", "Passwords do not match.");
        isValid = false;
      }

      if (!terms.checked) {
        document.getElementById("termsError").textContent =
          "Please accept the terms to continue.";
        isValid = false;
      }

      if (!isValid) {
        document.querySelector('[aria-invalid="true"]')?.focus();
        return;
      }

      successMessage.textContent =
        "Account created successfully for " + fullName.value.trim() + "!";
      successMessage.classList.add("show");
      form.reset();
      clearFullName();
      clearEmail();
      fullName.readOnly = true;
      email.readOnly = true;
      resetPhoneNumber(false);
    });

    [fullName, email, password, confirmPassword].forEach((input) => {
      input.addEventListener("input", () => {
        input.setAttribute("aria-invalid", "false");
      });
    });

    resetPhoneNumber(false);
  </script>
</body>
</html>
